# Netlify build settings.
#
# Next.js is meant to be zero-config on Netlify, but the first deploy published
# a folder with no page in it and served Netlify's own 404 at "/". Settings in
# this file override the dashboard, so pinning them here makes the deploy
# deterministic regardless of what the site's UI settings say.

[build]
  command = "npm run build"
  # The Netlify Next.js runtime reads Next's build output from here and turns
  # it into functions + static assets. It is NOT a static export directory.
  publish = ".next"

[build.environment]
  # Next 16 needs Node 20.9+. Pinned so a change to Netlify's default image
  # can't silently break the build.
  NODE_VERSION = "22"

# The Next.js runtime: turns Next's build output into Netlify Functions (the
# server pages, API routes and proxy) plus static assets. Netlify is supposed
# to add this automatically for a Next.js site, but on this site it did not —
# the deploy uploaded .next as plain files with "0 new function(s)" and served
# a 404. Declared explicitly (and pinned in devDependencies) so it always runs.
[[plugins]]
  package = "@netlify/plugin-nextjs"
